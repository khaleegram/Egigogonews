<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b5c45" />
    <title>Offline · Egigogo Newspaper</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #0e1512;
        --muted: #4a5751;
        --paper: #eef1ef;
        --accent: #1b5c45;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 100% 70% at 50% -10%, #d8e8e1, transparent 55%),
          var(--paper);
      }
      main {
        width: min(28rem, 100%);
        text-align: center;
      }
      img {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 0.75rem;
        object-fit: cover;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.65rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        font-family: system-ui, sans-serif;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.25rem;
        background: var(--accent);
        color: #f7f9f7;
        font: 600 0.95rem system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Egigogo" width="72" height="72" />
      <h1>You’re offline</h1>
      <p>
        Egigogo can’t reach the network right now. Check your connection and try
        again — recently opened pages may still be available.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
