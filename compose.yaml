# Local development database.
#
# Keeps production Neon compute asleep while you develop: local dev, seeds and
# builds all talk to this container instead of the metered Neon database.
#
#   npm run db:up     # start (Docker)
#   npm run db:down   # stop
#
# Connection string (already the default in .env.example):
#   postgresql://egigogo:egigogo@localhost:5433/egigogo
#
# Port 5433 is deliberate: 5432 is usually taken by a system PostgreSQL.

services:
  db:
    image: postgres:16-alpine
    container_name: egigogo-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: egigogo
      POSTGRES_PASSWORD: egigogo
      POSTGRES_DB: egigogo
    ports:
      - "5433:5432"
    volumes:
      - egigogo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egigogo -d egigogo"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  egigogo-pgdata:
